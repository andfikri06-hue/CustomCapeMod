name: Build CustomCapeMod

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Locate Android build-tools (d8) and platform (android.jar)
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "Android SDK: $SDK"

          # --- d8 ---
          BUILD_TOOLS_DIR="$SDK/build-tools"
          if [ -d "$BUILD_TOOLS_DIR" ] && [ -n "$(ls -A "$BUILD_TOOLS_DIR" 2>/dev/null)" ]; then
            VERSION=$(ls "$BUILD_TOOLS_DIR" | grep -E '^[0-9]' | sort -V | tail -1)
          else
            yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --install "build-tools;34.0.0" >/dev/null
            VERSION="34.0.0"
          fi
          echo "$BUILD_TOOLS_DIR/$VERSION" >> "$GITHUB_PATH"
          echo "build-tools: $VERSION"

          # --- android.jar (the Java UI uses android.* classes) ---
          JAR=""
          for API in 34 35 33 36 32 31 30; do
            if [ -f "$SDK/platforms/android-$API/android.jar" ]; then
              JAR="$SDK/platforms/android-$API/android.jar"
              break
            fi
          done
          if [ -z "$JAR" ]; then
            yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-34" >/dev/null
            JAR="$SDK/platforms/android-34/android.jar"
          fi
          echo "ANDROID_JAR=$JAR" >> "$GITHUB_ENV"
          echo "android.jar: $JAR"

      - name: Compile Java UI -> classes.dex -> src/EmbeddedDex.h
        run: |
          set -e
          rm -rf build_java && mkdir -p build_java/classes

          # Only these three files go into the dex. (CapeCanvasActivity.java is the
          # old WebView canvas and is not used any more.)
          javac -source 8 -target 8 -encoding UTF-8 -Xlint:-options \
            -bootclasspath "$ANDROID_JAR" \
            -d build_java/classes \
            src/CapeEditorModel.java src/CapeDownloadHelper.java src/CapePauseOverlay.java

          # one jar, so the many CapePauseOverlay$...class files need no shell quoting
          jar cf build_java/classes.jar -C build_java/classes .
          d8 --release --min-api 26 --lib "$ANDROID_JAR" --output build_java build_java/classes.jar

          # fail HERE (with a clear message) instead of at runtime inside the game
          python3 - <<'PY'
          import sys
          data = open("build_java/classes.dex", "rb").read()
          need = [
              b"Lorg/levimc/launcher/customcape/CapePauseOverlay;",
              b"Lorg/levimc/launcher/customcape/CapeEditorModel;",
              b"Lorg/levimc/launcher/customcape/CapeDownloadHelper;",
          ]
          missing = [n.decode() for n in need if n not in data]
          print("classes.dex:", len(data), "bytes")
          if data[:4] != b"dex\n" or missing:
              print("DEX CHECK FAILED. missing classes:", missing)
              sys.exit(1)
          print("dex check ok")
          PY

          python3 scripts/generate_embedded_dex_header.py build_java/classes.dex src/EmbeddedDex.h
          ls -la src/EmbeddedDex.h

      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r27c # match whatever NDK your other LeviLaunchroid mods build against

      - name: Install xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest

      - name: Configure (android target)
        run: |
          xmake f -p android --ndk="${{ steps.setup-ndk.outputs.ndk-path }}" -a arm64-v8a -m release -y

      - name: Build
        run: xmake build -v CustomCapeMod

      - name: Collect artifact
        run: |
          mkdir -p out/CustomCapeMod
          cp bin/CustomCapeMod.so out/CustomCapeMod/ 2>/dev/null || true
          cp manifest.json out/CustomCapeMod/
          cp -r assets out/CustomCapeMod/ 2>/dev/null || true
          ls -la out/CustomCapeMod

      - uses: actions/upload-artifact@v4
        with:
          name: CustomCapeMod-android
          path: out/CustomCapeMod

# NOTE: the NDK version, ABI (arm64-v8a), and xmake `-p android` flags
# above are a starting point. Since you already have GitHub Actions
# compiling other native LeviLaunchroid mods successfully, copy the
# exact `xmake f ...` line (and NDK setup step) from one of those
# working workflows instead of this guess - it's already proven against
# your actual toolchain/ABI combo.
